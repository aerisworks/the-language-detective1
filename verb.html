<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>الفعل</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>

<header><div class="logo">🕵️ المحقق اللغوي</div></header>

<main>
<div class="container">

    <div class="progress"><div style="width:48%"></div></div>

    <h1>ثانيًا: الفعل</h1>

    <p class="description">
        الفعل كلمة تدل على حدث أو عمل مرتبط بزمن.
    </p>

    <div class="cards">

        <div class="card">
            <div class="icon">📕</div>
            <h3>الفعل الماضي</h3>
            <h2>كتبَ</h2>
            <p>يدل على حدث وقع في الماضي.</p>
        </div>

        <div class="card">
            <div class="icon">📖</div>
            <h3>الفعل المضارع</h3>
            <h2>يكتبُ</h2>
            <p>يدل على حدث يحدث الآن أو يتجدد.</p>
        </div>

        <div class="card">
            <div class="icon">✍️</div>
            <h3>فعل الأمر</h3>
            <h2>اكتبْ</h2>
            <p>يدل على طلب القيام بعمل.</p>
        </div>

    </div>

    <div class="example">
        🔎 تذكر: كتب، يكتب، اكتب كلها أفعال.
    </div>
